apiVersion: v1
kind: ServiceAccount
metadata:
  name: resources-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resources-manager-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resources-manager-binding
subjects:
- kind: ServiceAccount
  name: resources-manager
roleRef:
  kind: Role
  name: resources-manager-role
  apiGroup: rbac.authorization.k8s.io