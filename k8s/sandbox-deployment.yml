apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas:  2
  selector:
    matchLabels:
      app:  sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      serviceAccountName: resources-manager
      containers:
      - image:  sandbox:v2
        imagePullPolicy: IfNotPresent
        name:  main-sandbox-container
        resources:
          requests:
            cpu: "300m"
            memory: "128M"
          limits:
            cpu: "600m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10    
        ports:
        - containerPort:  3000
          name:  main-sandbox